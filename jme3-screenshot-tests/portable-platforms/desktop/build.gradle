plugins {
    id 'java'
}

// The shared screenshot framework targets Java 17 (the engine proper targets 11).
java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}
tasks.named('compileJava') {
    options.release = 17
}

sourceSets.main.java.srcDir '../common/src/main/java'

dependencies {
    implementation project(':jme3-core')
    implementation project(':jme3-desktop')
    implementation project(':jme3-lwjgl3')
    implementation project(':jme3-screenshot-tests:jme3-screenshot-tests-shared')
    implementation project(':jme3-screenshot-tests:jme3-screenshot-tests-desktop')
    runtimeOnly libs.jme3.testdata
}

tasks.register('prepareLauncher') {
    dependsOn tasks.named('classes')
    inputs.files sourceSets.main.runtimeClasspath
    def file = layout.buildDirectory.file('launcher-classpath.txt')
    outputs.file(file)
    doLast {
        file.get().asFile.text = sourceSets.main.runtimeClasspath.asPath
    }
}
