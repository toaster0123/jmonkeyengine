name: Screenshot Comparison (macOS, Windows, iPhone)

on:
  pull_request:
  push:
    branches: [test/screenshots-desktop-ios]
  workflow_dispatch:
    inputs:
      reference_ref:
        description: 'Ref to generate reference screenshots from'
        required: true
      target_ref:
        description: 'Reviewed ref under test'
        required: true

permissions:
  contents: read

jobs:
  compare:
    name: Screenshot comparison (${{ matrix.name == 'macos' && 'macOS and iPhone' || matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.name == 'macos' && 120 || 60 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Desktop and iPhone use one allocation of the standard ARM64 runner.
          - name: macos
            os: macos-15
          - name: windows
            os: windows-latest
    steps:
      - name: Verify Apple Silicon runner
        if: matrix.name == 'macos'
        shell: bash
        run: |
          if [[ "$(uname -m)" != arm64 ]]; then
            echo "::error::Apple screenshot tests require an Apple Silicon runner"
            exit 1
          fi
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.target_ref }}
          fetch-depth: 2
          persist-credentials: false
      - name: Resolve and check out the reference
        id: refs
        uses: ./.github/actions/screenshot-reference-checkout
        with:
          # Keep fork-only push checks pinned to their verified upstream baseline.
          reference_ref: ${{ inputs.reference_ref || (github.event_name == 'push' && '99fbd097325892e3243c8bb3a504298fbdf710f3') || '' }}
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/wrapper-validation@v6.4.0
        id: wrapper
      - name: Prepare isolated iPhone checkouts
        id: iphone_checkouts
        if: matrix.name == 'macos' && steps.refs.outputs.reference_supported == 'true'
        shell: bash
        run: |
          ios_root="$RUNNER_TEMP/jme-screenshot-ios"
          mkdir "$ios_root"
          git worktree add --detach "$ios_root/target" HEAD
          git -C reference worktree add --detach "$ios_root/reference" HEAD
      # The two platform results are independent after common setup. Neither
      # failure is softened; the iPhone test can still run after desktop fails.
      - name: Render desktop screenshots
        if: ${{ !cancelled() && steps.wrapper.outcome == 'success' && steps.refs.outputs.reference_supported == 'true' }}
        timeout-minutes: ${{ matrix.name == 'macos' && 55 || 60 }}
        shell: bash
        run: bash jme3-screenshot-tests/portable-platforms/run-comparison.sh desktop reference
      - name: Select and report simulator toolchain
        id: iphone_toolchain
        if: ${{ !cancelled() && steps.iphone_checkouts.outcome == 'success' }}
        shell: bash
        env:
          # macos-15 defaults to Xcode 16.4; select the preinstalled 26.3 and
          # its iOS 26.2 SDK without changing the runner's system selection.
          DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
        run: |
          uname -m
          sw_vers
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
          xcrun simctl list runtimes available
          xcrun simctl list devices available
          printf 'DEVELOPER_DIR=%s\n' "$DEVELOPER_DIR" >> "$GITHUB_ENV"
      - name: Render iPhone Simulator screenshots
        if: ${{ !cancelled() && steps.iphone_toolchain.outcome == 'success' }}
        working-directory: ${{ runner.temp }}/jme-screenshot-ios/target
        shell: bash
        run: bash jme3-screenshot-tests/portable-platforms/run-comparison.sh ios ../reference
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshot-platform-${{ matrix.name }}
          path: portable-screenshot-report
      - uses: actions/upload-artifact@v7
        if: always() && matrix.name == 'macos'
        with:
          name: screenshot-platform-iphone-simulator
          path: ${{ runner.temp }}/jme-screenshot-ios/target/portable-screenshot-report
